name: Build installers on release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- lite : sans IA, toutes plateformes / architectures ----
          - { os: macos-15-intel, edition: lite, artifact_suffix: mac-intel }
          - { os: macos-14, edition: lite, artifact_suffix: mac-arm }
          - { os: windows-latest, edition: lite, artifact_suffix: windows-x86_64 }
          - { os: ubuntu-latest, edition: lite, artifact_suffix: linux-x86_64 }
          - { os: ubuntu-24.04-arm, edition: lite, artifact_suffix: linux-arm64 }
          # ---- full : avec IA (pas de macOS Intel : plus de wheels torch ; Windows : lite only) ----
          - { os: macos-14, edition: full, artifact_suffix: mac-arm }
          - { os: ubuntu-latest, edition: full, artifact_suffix: linux-x86_64 }
          - { os: ubuntu-24.04-arm, edition: full, artifact_suffix: linux-arm64 }

    runs-on: ${{ matrix.os }}

    env:
      EXIFTOOLS_EDITION: ${{ matrix.edition }}
      ARTIFACT_NAME: ExifTools-${{ github.event.release.tag_name }}-${{ matrix.edition }}-${{ matrix.artifact_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ runner.os == 'Windows' && '3.11' || '3.12' }}

      - name: Linux - install CPU-only torch first
        if: runner.os == 'Linux' && matrix.edition == 'full'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.edition == 'lite' && 'requirements-lite.txt' || 'requirements.txt' }}
          python -m pip install pyinstaller
          python -m pip cache purge

      - name: Windows - generate version resource for EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $ver = "${{ github.event.release.tag_name }}"
          $parts = $ver.Split(".")
          while ($parts.Length -lt 3) { $parts += "0" }
          $maj = $parts[0]; $min = $parts[1]; $pat = $parts[2]

          @"
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($maj, $min, $pat, 0),
              prodvers=($maj, $min, $pat, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x4,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  '040904B0',
                  [
                    StringStruct('CompanyName', 'Jul SQL'),
                    StringStruct('FileDescription', 'ExifTools'),
                    StringStruct('FileVersion', '$ver'),
                    StringStruct('InternalName', 'ExifTools'),
                    StringStruct('OriginalFilename', 'ExifTools.exe'),
                    StringStruct('ProductName', 'ExifTools'),
                    StringStruct('ProductVersion', '$ver')
                  ]
                )
              ]),
              VarFileInfo([VarStruct('Translation', [0x0409, 1200])])
            ]
          )
          "@ | Set-Content -Encoding UTF8 build/version_info.txt

      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean ExifTools.spec

      # ---------------- macOS: DMG ----------------
      - name: macOS - create DMG
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install create-dmg
          mkdir -p out
          create-dmg \
            --volname "ExifTools" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 120 \
            --app-drop-link 600 185 \
            "out/$ARTIFACT_NAME.dmg" \
            "dist/ExifTools.app"

      # ---------------- Windows: Inno Setup installer ----------------
      - name: Windows - install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Windows - build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $ver = "${{ github.event.release.tag_name }}"

          @"
          #define MyAppName "ExifTools"
          #define MyAppVersion "$ver"
          #define MyAppPublisher "Jul SQL"
          #define MyAppExeName "ExifTools.exe"

          [Setup]
          AppId={{A8C2D3A1-0000-0000-0000-000000000001}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=out
          OutputBaseFilename=$env:ARTIFACT_NAME-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          VersionInfoVersion={#MyAppVersion}
          VersionInfoProductVersion={#MyAppVersion}
          VersionInfoProductName={#MyAppName}
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoDescription={#MyAppName}

          [Files]
          Source: "dist\ExifTools\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Créer une icône sur le bureau"; GroupDescription: "Raccourcis:"; Flags: unchecked

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Lancer ExifTools"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 installer.iss

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # ---------------- Linux: tar.gz ----------------
      - name: Linux - prepare release package
        if: runner.os == 'Linux'
        run: |
          rm -rf build/
          rm -rf .git/
          RELEASE_DIR=release
          mkdir -p $RELEASE_DIR
          mkdir -p out
          mv dist/ExifTools $RELEASE_DIR/
          cp assets/icon.png $RELEASE_DIR/exiftools.png
          tar czf out/$ARTIFACT_NAME.tar.gz -C $RELEASE_DIR .
          ls -lh out/$ARTIFACT_NAME.tar.gz

      # ---------------- Upload release assets ----------------
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*